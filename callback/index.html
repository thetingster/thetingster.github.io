<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Tesla sign-in code</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}code{display:block;word-break:break-all;background:#eee;padding:12px;font-size:15px}button{margin-top:12px;padding:10px 18px;font-size:16px}</style></head>
<body><h2>Tesla sign-in code</h2><p id="msg">Reading code...</p><code id="c"></code><button id="b" onclick="navigator.clipboard.writeText(document.getElementById('c').textContent).then(()=>{this.textContent='Copied'})">Copy code</button>
<script>var p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');
if(c){document.getElementById('c').textContent=c;document.getElementById('msg').textContent='Copy this code and paste it into the masked box in your chat. It expires in a few minutes and works only once.';}
else{document.getElementById('b').style.display='none';document.getElementById('msg').textContent=e?('Tesla returned an error: '+e+' '+(p.get('error_description')||'')):'No code found in this page address.';}
history.replaceState(null,'',location.pathname);</script></body></html>
